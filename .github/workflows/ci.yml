name: WWW CI
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 전체 검증할 결합 후보 커밋 SHA (생략하면 선택한 ref의 기본 동작)
        type: string
        required: false
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || inputs.candidate_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pr_scope:
    name: PR 변경 범위와 집중 검사
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.action != 'ready_for_review'
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      registration: ${{ steps.register.outputs.record }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: GitHub 이슈의 세션 선정 코멘트 조회
        id: register
        if: github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ github.token }}
          WWW_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          if [[ "$WWW_HEAD_REF" =~ ^codex/session-([1-9][0-9]*)/issue-[1-9][0-9]*- ]]; then
            comment_id=${BASH_REMATCH[1]}
            if record=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --jq 'select((.body | length) <= 4096 and .author_association == "OWNER") | {id:(.id|tostring), author_association, html_url, body} | @json'); then
              printf 'record=%s\n' "$record" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: 기준 브랜치의 판정기로 PR 범위 확인
        id: scope
        env:
          WWW_SESSION_REGISTRATION: ${{ steps.register.outputs.record }}
          WWW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WWW_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          policy="$RUNNER_TEMP/www-pr-verification.mts"
          if ! git show "$WWW_BASE_SHA:scripts/pr-verification.ts" > "$policy"; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node "$policy" verify "$WWW_BASE_SHA" "$WWW_PR_HEAD" "$GITHUB_SHA"
  validate:
    name: ${{ needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'session-app' && '세션 초안 앱 검사' || 'validate' }}
    needs: pr_scope
    if: ${{ !cancelled() && (needs.pr_scope.result != 'success' || needs.pr_scope.outputs.mode != 'focused') }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      WWW_APP_DRAFT: ${{ needs.pr_scope.result == 'success' && needs.pr_scope.outputs.mode == 'session-app' }}
      BOXBOX_MODE: check
      WWW_CHECKOUT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    steps:
      - name: 전체 검사 대상 SHA 확인
        run: '[[ "$WWW_CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WWW_CHECKOUT_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: npm ci
      - if: env.WWW_APP_DRAFT != 'true'
        run: npm install --global @openai/codex@0.167.2
      - if: env.WWW_APP_DRAFT != 'true'
        name: 검토 읽기 검사에 필요한 ripgrep 준비
        run: |
          if ! command -v rg >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
          rg --version
      - name: 공개 BoxBox headless 설치
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/boxbox-engine"
          npm exec --yes --package=boxbox-plugin@0.2.9 -- boxbox --engine-only
          echo "BOXBOX_CI_ROOT=$XDG_DATA_HOME/boxbox/codex/0.2.9" >> "$GITHUB_ENV"
      - run: npm run setup:ci
      - name: 초안 앱의 타입·구조·빌드·영향 검사
        if: env.WWW_APP_DRAFT == 'true'
        env:
          WWW_SESSION_REGISTRATION: ${{ needs.pr_scope.outputs.registration }}
          WWW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WWW_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          policy="$RUNNER_TEMP/www-session-app-verification.mts"
          git show "$WWW_BASE_SHA:scripts/pr-verification.ts" > "$policy"
          node "$policy" app-check "$WWW_BASE_SHA" "$WWW_PR_HEAD" "$GITHUB_SHA"
      - name: 체크아웃 검증 및 필요한 패키징
        if: env.WWW_APP_DRAFT != 'true'
        id: validate
        env:
          WWW_PACKAGE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.candidate_sha)) }}
          WWW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          WWW_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          verify_checkout() {
            test "$(git rev-parse HEAD)" = "$WWW_CHECKOUT_SHA"
            git diff --exit-code HEAD --
            untracked=$(git ls-files --others --exclude-standard)
            if [ -n "$untracked" ]; then
              printf '검증 체크아웃에 추적되지 않는 경로가 있습니다.\n%s\n' "$untracked" >&2
              return 1
            fi
          }
          verify_checkout
          if [ "$WWW_PACKAGE" = true ]; then
            npm run release:package
          else
            npm run release:verify
          fi
          verify_checkout
          checked_tree=$(git rev-parse 'HEAD^{tree}')
          checked_parents=$(git show -s --format=%P "$WWW_CHECKOUT_SHA")
          printf 'WWW_VERIFIED_TREE %s %s %s %s\n' "$WWW_CHECKOUT_SHA" "$checked_tree" "${WWW_BASE_SHA:-없음}" "${WWW_PR_HEAD:-없음}" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'WWW_VERIFIED_PARENTS %s %s\n' "$WWW_CHECKOUT_SHA" "$checked_parents" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.validate.outcome == 'success' && steps.validate.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: www-${{ github.sha }}-darwin-arm64
          path: ${{ steps.validate.outputs.path }}/*
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
  windows_validate:
    name: Windows x64 검사와 패키징
    needs: pr_scope
    if: ${{ !cancelled() && (needs.pr_scope.result != 'success' || needs.pr_scope.outputs.mode != 'focused') }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BOXBOX_MODE: check
      WWW_CHECKOUT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    steps:
      - name: 전체 검사 대상 SHA 확인
        shell: pwsh
        run: 'if ("$env:WWW_CHECKOUT_SHA" -notmatch ''^[0-9a-f]{40}$'') { throw "전체 커밋 SHA가 필요합니다." }'
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ env.WWW_CHECKOUT_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: 동결 소스 바이트 감사
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config --local core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "Git 줄바꿈 설정 실패: $LASTEXITCODE" }
          foreach ($file in @('spikes/tauri/build.ts', 'spikes/tauri/src/bridge.ts')) {
            $blob = git rev-parse ('{0}:{1}' -f $env:WWW_CHECKOUT_SHA, $file)
            if ($LASTEXITCODE -ne 0) { throw "정본 blob 조회 실패: $file ($LASTEXITCODE)" }
            $working = git hash-object --no-filters -- $file
            if ($LASTEXITCODE -ne 0) { throw "작업 파일 해시 조회 실패: $file ($LASTEXITCODE)" }
            if ($working -ne $blob) { throw "동결 소스 바이트가 정본과 다릅니다: $file" }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: npm.cmd ci
      - run: npm.cmd install --global @openai/codex@0.167.2
      - name: 공개 BoxBox headless 설치
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm.cmd exec --yes --package=boxbox-plugin@0.2.9 -- boxbox --engine-only
          if ($LASTEXITCODE -ne 0) { throw "BoxBox 설치 실패: $LASTEXITCODE" }
          $boxboxRoot = Join-Path $env:LOCALAPPDATA 'BoxBox\Codex\0.2.9'
          if (-not (Test-Path (Join-Path $boxboxRoot 'plugin\scripts\boxbox.mjs'))) { throw "BoxBox Codex 엔진 설치를 찾을 수 없습니다: $boxboxRoot" }
          "BOXBOX_CI_ROOT=$boxboxRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm.cmd run setup:ci
      - name: Windows checkout 준비
        id: windows_setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/windows-setup.ts
          if ($LASTEXITCODE -ne 0) { throw "Windows setup 실패: $LASTEXITCODE" }
      - name: Windows Codex 네이티브 바이너리 smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $executionJson = node --input-type=module -e "import { providerExecution } from './scripts/workflow/adapters/windows-command.ts'; process.stdout.write(JSON.stringify(providerExecution({ command: 'codex', args: ['--version'] })));"
          if ($LASTEXITCODE -ne 0) { throw "Codex provider 해석 실패: $LASTEXITCODE" }
          $execution = $executionJson | ConvertFrom-Json
          if ($execution.executionPlatform -ne 'win32' -or $null -eq $execution.actualInvocation) { throw 'Windows Codex 실제 실행 경로를 확인하지 못했습니다.' }
          $codexExe = [string]$execution.command
          if (-not (Test-Path -LiteralPath $codexExe -PathType Leaf)) { throw "해석한 Codex 네이티브 exe를 찾을 수 없습니다: $codexExe" }
          $codexVersion = & $codexExe @($execution.args)
          if ($LASTEXITCODE -ne 0) { throw "Codex 네이티브 버전 확인 실패: $LASTEXITCODE" }
          "WWW_WINDOWS_CODEX_BINARY $codexExe $($execution.actualInvocation.executableDigest) $codexVersion" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Windows x64 패키지
        id: windows_package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          function Assert-CleanCheckout {
            $head = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw "Git HEAD 조회 실패: $LASTEXITCODE" }
            if ($head -ne $env:WWW_CHECKOUT_SHA) { throw '검증 대상 커밋이 다릅니다.' }
            git diff --exit-code HEAD --
            if ($LASTEXITCODE -ne 0) { throw "추적 파일 변경 확인 실패: $LASTEXITCODE" }
            $untracked = git ls-files --others --exclude-standard
            if ($LASTEXITCODE -ne 0) { throw "미추적 파일 확인 실패: $LASTEXITCODE" }
            if ($untracked) { throw "검증 체크아웃에 추적되지 않는 경로가 있습니다.`n$untracked" }
          }
          Assert-CleanCheckout
          node scripts/windows-package.ts
          if ($LASTEXITCODE -ne 0) { throw "Windows 패키징 실패: $LASTEXITCODE" }
          Assert-CleanCheckout
          $package = Join-Path $PWD '.www\packages\WWW-Electron-win32-x64\WWW-Electron.exe'
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) { throw "Windows 패키지 실행 파일을 찾을 수 없습니다: $package" }
          $packageHash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { throw "Git tree 조회 실패: $LASTEXITCODE" }
          "WWW_WINDOWS_PACKAGE $env:WWW_CHECKOUT_SHA $tree $package $packageHash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Windows x64 패키지 보관
        if: ${{ steps.windows_package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: www-${{ github.sha }}-win32-x64
          path: .www/packages/WWW-Electron-win32-x64
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
      - name: Windows Node의 Native 응답 전송 확인
        if: ${{ !cancelled() && steps.windows_setup.outcome == 'success' }}
        shell: pwsh
        run: node --experimental-transform-types test/fixtures/conversations-node-probe.ts
      - name: Windows 전체 회귀 검사
        if: ${{ !cancelled() && steps.windows_setup.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm.cmd run check
          if ($LASTEXITCODE -ne 0) { throw "전체 검사 실패: $LASTEXITCODE" }
