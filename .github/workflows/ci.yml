name: WWW CI
on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BOXBOX_MODE: check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: npm ci
      - run: npm install --global @openai/codex@0.167.2
      - name: 검토 읽기 검사에 필요한 ripgrep 준비
        run: |
          if ! command -v rg >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
          rg --version
      - name: 공개 BoxBox headless 설치
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/boxbox-engine"
          npm exec --yes --package=boxbox-plugin@0.2.9 -- boxbox --engine-only
          echo "BOXBOX_CI_ROOT=$XDG_DATA_HOME/boxbox/codex/0.2.9" >> "$GITHUB_ENV"
      - run: npm run setup:ci
      - name: 체크아웃 검증 및 필요한 패키징
        id: validate
        env:
          WWW_PACKAGE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          WWW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          WWW_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          verify_checkout() {
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            git diff --exit-code HEAD --
            untracked=$(git ls-files --others --exclude-standard)
            if [ -n "$untracked" ]; then
              printf '검증 체크아웃에 추적되지 않는 경로가 있습니다.\n%s\n' "$untracked" >&2
              return 1
            fi
          }
          verify_checkout
          if [ "$WWW_PACKAGE" = true ]; then
            npm run release:package
          else
            npm run release:verify
          fi
          verify_checkout
          checked_tree=$(git rev-parse 'HEAD^{tree}')
          checked_parents=$(git show -s --format=%P "$GITHUB_SHA")
          printf 'WWW_VERIFIED_TREE %s %s %s %s\n' "$GITHUB_SHA" "$checked_tree" "${WWW_BASE_SHA:-없음}" "${WWW_PR_HEAD:-없음}" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'WWW_VERIFIED_PARENTS %s %s\n' "$GITHUB_SHA" "$checked_parents" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.validate.outcome == 'success' && steps.validate.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: www-${{ github.sha }}-darwin-arm64
          path: ${{ steps.validate.outputs.path }}/*
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
