<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><meta name="viewport" content="width=device-width"><title>WWW</title><style>
:root{--bg:#0b0b0c;--surface:#111113;--raised:#18181b;--row:#1f1f23;--border:#29292e;--text:#ececee;--muted:#8b8b92;--accent:#8ab4ff;--warn:#f5b740;--ok:#4ade80;--error:#f87171;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}#root{display:grid;grid-template-columns:268px minmax(420px,1fr) 400px;grid-template-rows:1fr 28px;height:100vh}.sidebar{display:grid;grid-template-rows:44px auto 1fr auto auto;border-right:1px solid var(--border);min-height:0}.brand,.sec{display:flex;align-items:center;padding:0 14px}.brand{font-weight:700;font-size:14px}.sec{justify-content:space-between;color:var(--muted);padding-top:8px}.srow{display:flex;align-items:center;gap:8px;margin:6px 8px;padding:6px;border-radius:6px;min-width:0}.srow.active{background:var(--row)}.name,.right{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.name{font-weight:600}.right{margin-left:auto;color:var(--muted)}.avatar{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;background:#3b82f6;font-size:10px}.agentmark{width:14px;height:9px;border-radius:2px;background:#10a37f}.agents{border-top:1px solid var(--border)}.group{padding:10px 14px 2px;color:var(--muted);font-size:11px}.footer{padding:9px 14px;border-top:1px solid var(--border);display:grid;gap:3px;overflow:hidden}.muted{color:var(--muted)}.work{display:grid;grid-template-rows:44px 1fr;min-width:0;min-height:0}.tabrow{display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--border)}.spacer,.grow{flex:1}.tab,.tool,.icon,.ptab{border:0;background:none}.tab,.tool{padding:5px 10px;border-radius:6px}.active,.selected{background:var(--raised)!important}.stage{padding:8px;min-height:0}.pane{display:grid;grid-template-rows:35px 1fr;height:100%;border:1px solid #5b8def;border-radius:8px;overflow:hidden}.title{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border)}.title .path{color:var(--muted)}.body,.conversation{min-height:0}.conversation{height:100%;display:grid;grid-template-rows:1fr auto}.transcript{overflow:auto;padding:16px 18px;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace}.empty{color:var(--muted)}.agent{white-space:pre-wrap;margin:8px 0}.agent:before{content:'● ';color:var(--ok)}.streaming:after{content:'▍';color:var(--muted)}.cmd{margin:8px 0;padding-left:10px;border-left:2px solid var(--border)}.cmd.failed{border-color:var(--error)}.cmd summary{display:flex;gap:10px}.cmdline{color:var(--accent);word-break:break-all}.cmdstate{margin-left:auto;color:var(--muted)}.cmd pre{max-height:240px;overflow:auto;color:var(--muted);white-space:pre-wrap}.files{color:var(--muted);margin:7px 0}.approval{border:1px solid var(--warn);border-radius:8px;padding:10px 12px;margin:8px 0}.ahead{font-weight:700;color:var(--warn)}.abody{margin:6px 0;white-space:pre-wrap}.aact{display:flex;gap:6px}.aact button,.secondary{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 9px}.compose{border-top:1px solid var(--border);margin:0 14px;padding:10px 0;display:grid;grid-template-columns:auto 1fr auto;gap:8px}.compose textarea{resize:none;background:none;border:0;outline:0;min-height:24px}.actions{display:flex;gap:6px}.primary{border:0;border-radius:6px;padding:6px 12px;background:var(--text);color:var(--bg);font-weight:600}.panel{display:grid;grid-template-rows:44px 44px 1fr auto;border-left:1px solid var(--border);min-height:0}.phead,.ptabs,.pfooter{display:flex;align-items:center;gap:9px;padding:0 14px}.logo{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--accent),var(--ok),var(--warn),var(--accent))}.phead .title{padding:0;border:0;font-weight:700}.pill{margin-left:auto;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--raised);color:var(--muted);padding:2px 7px;border-radius:6px}.ptabs{gap:18px;border-bottom:1px solid var(--border)}.ptab{height:100%;color:var(--muted)}.ptab.active{color:var(--text);border-bottom:2px solid var(--text);border-radius:0}.aside{margin-left:auto;color:var(--muted)}.pbody{overflow:auto}.headline{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:15px}.glyph{border:2px solid currentColor;border-radius:50%;width:18px;height:18px;display:grid;place-items:center}.h{font-size:16px;font-weight:700}.sub{color:var(--muted);font-size:12px}.t-working,.t-blocked{color:var(--warn)}.t-idle{color:var(--muted)}.counts{display:grid;grid-template-columns:repeat(3,1fr);margin:0 14px;border:1px solid var(--border);border-radius:8px}.count{text-align:center;padding:10px;border-right:1px solid var(--border)}.count:last-child{border:0}.count .n{font-size:17px;font-weight:700}.count .l{color:var(--muted)}.blocked{color:var(--warn)}.ledger{padding:9px 14px;font:12px/1.7 ui-monospace,monospace}.entry{display:grid;grid-template-columns:36px 70px 1fr;gap:7px}.seq,.prov{color:var(--muted)}.pfooter{padding:9px 14px;border-top:1px solid var(--border);color:var(--muted)}.status{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 14px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}.err{color:var(--error);overflow:hidden;text-overflow:ellipsis}@media(max-width:1100px){#root{grid-template-columns:220px 1fr 340px}}
